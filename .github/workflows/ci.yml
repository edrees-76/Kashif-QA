name: KASHIF-QA Continuous Integration

on:
  push:
    branches: [ main, phase-*, docs/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify dependency integrity
      run: |
        pip check

    - name: Run test suite with coverage
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        pytest --cov=kashif --cov-report=term-missing tests/ -v

  test-latest:
    # Non-required: mirrors the developer's Python to catch version drift early (see DECISIONS #9)
    runs-on: windows-latest
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.14"
        cache: "pip"
    - run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip check
    - name: Run test suite
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        pytest --cov=kashif tests/ -v
